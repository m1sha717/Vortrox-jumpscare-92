name: Build Geode Mod
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings-ref: main

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortrox-jumpscare-android
          path: "**/*.geode"
