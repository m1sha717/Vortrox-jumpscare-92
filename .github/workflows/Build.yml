name: Build Geode Mod

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android
            os: ubuntu-latest
            target: android
          - name: Windows
            os: windows-latest
            target: win

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup xmake
      uses: xmake-io/xmake-action@v1
      with:
        xmake-version: latest

    - name: Build Mod via Xmake
      run: |
        xmake config --plat=${{ matrix.config.target }} -p Release
        xmake

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: geode-mod-${{ matrix.config.target }}
        path: |
          build/**/*.geode
          *.geode
