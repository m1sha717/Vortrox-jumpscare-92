name: Build Geode Mod

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

  
    - name: Setup Geode CLI
      uses: geode-sdk/build-geode-mod@main
      with:
        combine: true

    
    - name: Build via Xmake
      run: |
        geode sdk install-binaries --platform android
        geode build --platform android

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: geode-mod-android
        path: "build/**/*.geode"
