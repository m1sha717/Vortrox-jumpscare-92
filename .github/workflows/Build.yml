name: Build Geode Mod

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android
            os: ubuntu-latest
            target: Android
          - name: Windows
            os: windows-latest
            target: Windows

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Mod
      uses: geode-sdk/build-geode-mod@main
      with:
        build-config: Release
      env:
        GEODE_TARGET: ${{ matrix.config.target }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: geode-mod-${{ matrix.config.target }}
        path: build/*.geode
