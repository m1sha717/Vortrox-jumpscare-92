name: Build Geode Mod

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Mod for Android
      uses: geode-sdk/build-geode-mod@main

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: geode-mod-files
        path: "**/*.geode"
